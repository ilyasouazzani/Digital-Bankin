# =========================================================
# Digital Banking Application - Configuration
# =========================================================

spring.application.name=digital-banking-backend
server.port=8085

# =========================================================
# DataSource - H2 (développement)
# =========================================================
spring.datasource.url=jdbc:h2:mem:digital-banking-db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Console H2 (désactiver en production)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# =========================================================
# JPA / Hibernate
# =========================================================
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true

# =========================================================
# MySQL (Production) - décommenter et remplir si nécessaire
# =========================================================
# spring.datasource.url=jdbc:mysql://localhost:3306/digital_banking?createDatabaseIfNotExist=true
# spring.datasource.username=root
# spring.datasource.password=secret
# spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
# spring.jpa.hibernate.ddl-auto=update

# =========================================================
# JWT Security (Partie 3)
# =========================================================
# Clé secrète de 256 bits minimum (Base64) - À changer en production !
app.jwt.secret=3cfa76ef14937c1c0ea519f8fc057a80fcd04a7420f8e8bcd0a7567c272e007b
app.jwt.expiration=86400000

# =========================================================
# Swagger / OpenAPI
# =========================================================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# =========================================================
# Logging
# =========================================================
logging.level.com.digitalbanking=DEBUG
logging.level.org.springframework.security=DEBUG
