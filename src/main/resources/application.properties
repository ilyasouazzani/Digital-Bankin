# =========================================================
# Digital Banking Application - Configuration complète
# =========================================================
spring.application.name=digital-banking-backend
server.port=8085

# =========================================================
# DataSource - H2 (développement)
# =========================================================
spring.datasource.url=jdbc:h2:mem:digital-banking-db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# =========================================================
# JPA / Hibernate
# =========================================================
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# =========================================================
# JWT Security
# =========================================================
app.jwt.secret=3cfa76ef14937c1c0ea519f8fc057a80fcd04a7420f8e8bcd0a7567c272e007b
app.jwt.expiration=86400000

# =========================================================
# Spring AI - OpenAI
# Clé injectée depuis variable d'environnement : OPENAI_API_KEY
# =========================================================
spring.ai.openai.api-key=${OPENAI_API_KEY:sk-demo-not-configured}
spring.ai.openai.chat.options.model=gpt-3.5-turbo
spring.ai.openai.chat.options.temperature=0.7

# =========================================================
# Telegram Bot
# Tokens injectés depuis variables d'environnement
# =========================================================
telegram.bot.token=${TELEGRAM_BOT_TOKEN:TELEGRAM_TOKEN_NOT_SET}
telegram.bot.username=${TELEGRAM_BOT_USERNAME:digitalbanking_bot}

# =========================================================
# Swagger / OpenAPI
# =========================================================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# =========================================================
# Logging
# =========================================================
logging.level.com.digitalbanking=DEBUG
logging.level.org.springframework.security=WARN
logging.level.org.springframework.ai=DEBUG
