<div class="min-vh-100 d-flex align-items-center justify-content-center bg-light">
  <div class="card shadow-lg border-0" style="width: 420px;">
    <div class="card-body p-5">
      <div class="text-center mb-4">
        <i class="bi bi-bank2 text-primary" style="font-size:3rem;"></i>
        <h3 class="fw-bold mt-2">Digital Banking</h3>
        <p class="text-muted small">Connectez-vous à votre espace</p>
      </div>

      @if (errorMessage) {
        <div class="alert alert-danger alert-dismissible">
          <i class="bi bi-exclamation-triangle-fill me-2"></i>{{ errorMessage }}
        </div>
      }

      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        <div class="mb-3">
          <label class="form-label fw-semibold">Nom d'utilisateur</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-person"></i></span>
            <input type="text" class="form-control" formControlName="username" placeholder="admin">
          </div>
          @if (loginForm.get('username')?.invalid && loginForm.get('username')?.touched) {
            <div class="text-danger small mt-1">Minimum 3 caractères requis</div>
          }
        </div>

        <div class="mb-4">
          <label class="form-label fw-semibold">Mot de passe</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-lock"></i></span>
            <input type="password" class="form-control" formControlName="password" placeholder="••••••••">
          </div>
        </div>

        <button type="submit" class="btn btn-primary w-100 fw-bold py-2" [disabled]="loading || loginForm.invalid">
          @if (loading) {
            <span class="spinner-border spinner-border-sm me-2"></span>
          }
          Se connecter
        </button>
      </form>
    </div>
  </div>
</div>
